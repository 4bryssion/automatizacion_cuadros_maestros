[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadro-maestro"
version = "0.1.0"
description = "Genera el cuadro maestro internacional de un programa académico (Areandina, sede Pereira)"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "Pillow>=10"]   # Pillow: logo del CNA en el cuadro

[project.optional-dependencies]
desarrollo = ["pytest>=8"]
empaquetado = ["pyinstaller>=6", "cryptography>=42"]   # tools/empaquetar.py y tools/marca.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
